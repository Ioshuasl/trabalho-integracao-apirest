services:
  db:
    image: postgres:16-alpine
    container_name: entregas-db
    environment:
      POSTGRES_USER: entregas
      POSTGRES_PASSWORD: entregas
      POSTGRES_DB: entregas
    ports:
      - "5432:5432"
    volumes:
      - entregas_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U entregas -d entregas"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  entregas_pgdata:
